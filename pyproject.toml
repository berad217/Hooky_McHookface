[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hooky-mchookface"
version = "0.5.0"
description = "Async-native, framework-grade webhook receiver: FastAPI + SQLite + pluggable handlers/validators/tunnel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brad White" }]
keywords = ["webhook", "fastapi", "async", "receiver", "hmac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "aiosqlite>=0.19",
    "click>=8.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "python-ulid>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "respx>=0.20",
    "ruff>=0.1",
    "mypy>=1.7",
    "types-PyYAML>=6.0",
]
ngrok = ["pyngrok>=7.0"]

[project.scripts]
hooky = "hooky.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/hooky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
